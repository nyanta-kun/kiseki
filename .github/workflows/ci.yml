name: CI

# workflowレベルのデフォルト権限を最小化（INF-009）
permissions:
  contents: read
  actions: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guards:
    name: Guards (並列開発ガード)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # merge-base を取るため全履歴が必要

      # このジョブで実際にビルドを止められるのは下の Alembic 整合チェックだけ。
      # 柱(pillar)判定は OWNERSHIP_STRICT=1 のときのみ失敗を返す設計で、CI では
      # 有効化していない (柱をまたぐ正当な PR まで落としてしまうため)。
      # 強制ではなくレビュー材料として Step Summary に出す。
      # STRICT=1 で命名不一致 (ファイル名接頭辞 != revision ID) も失敗扱いにする。
      # 既存の不一致1件は解消済みで、鉄則5 の `<日時>_<柱>` 形式は接頭辞一致で
      # 検査するため通る。追跡性を保つ最後の砦なので緩めないこと。
      - name: Alembic 整合チェック (head 単一 / ID 重複 / 親不明 / 命名一致)
        env:
          MIGRATION_CHECK_STRICT: "1"
        run: bash scripts/dev/check_migrations.sh

      - name: 柱(pillar)所属レポート (情報提供・ビルドは止めない)
        run: |
          {
            echo '## 柱(pillar)所属レポート'
            echo
            echo '> 情報提供のみ。ここでの警告は CI を落としません。'
            echo '> 強制したい場合はローカルで `OWNERSHIP_STRICT=1 bash scripts/dev/check_ownership.sh`。'
            echo
            echo '```'
            bash scripts/dev/check_ownership.sh "origin/${{ github.base_ref || 'main' }}" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.6.10"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src/ --ignore-missing-imports

      - name: Tests (pytest)
        run: uv run pytest tests/ -v --tb=short --cov=src --cov-report=xml
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          API_KEY: "test-key"
          API_ENV: "test"

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type check (tsc)
        run: pnpm exec tsc --noEmit

      - name: Build
        if: github.event_name == 'pull_request'
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          AUTH_SECRET: "ci-test-secret-32-chars-long-ok"
          AUTH_PASSWORD: "test"
          AUTH_URL: "http://localhost:3000/api/auth"

  build-backend:
    name: Build & Push Backend Image
    needs: []
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: false

  build-frontend:
    name: Build & Push Frontend Image
    needs: []
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:main
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.galloplab.com
            NEXT_PUBLIC_WS_URL=wss://api.galloplab.com
            NEXT_PUBLIC_PAID_MODE=${{ vars.NEXT_PUBLIC_PAID_MODE }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false

  deploy:
    name: Deploy to galloplab.com
    needs: [build-backend, build-frontend, guards, backend, frontend]
    runs-on: ubuntu-latest
    # GitHub Environments の required_reviewers で承認ゲートを設定可能（INF-014）
    # Settings > Environments > production > Required reviewers に承認者を追加することを推奨
    environment: production
    # deployジョブに必要な権限を明示（INF-009）
    permissions:
      contents: read
    # main ブランチへの push 時のみデプロイ（PR では実行しない）
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # セキュリティ強化: DEPLOY_SSH_KNOWN_HOSTS シークレットにホストの公開鍵フィンガープリントを
          # 格納することを推奨。設定方法: ssh-keyscan <host> をローカルで実行し出力を
          # GitHub Secrets の DEPLOY_SSH_KNOWN_HOSTS に登録する。
          # 登録済みの場合は以下をコメントアウトして known_hosts シークレットを使用:
          #   printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy (Blue-Green)
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
              'cd ~/GitHub/kiseki && git fetch origin main && git reset --hard origin/main && bash scripts/deploy-bluegreen.sh'
