# 有効化（clone ごとに 1 回）: pre-commit install
#
# 2026-09-23: これまで pre-commit 自体が未導入で、設定はあるのに一度も
# 動いていなかった。mypy フックも壊れていた（リポジトリ直下の src/ を見ていたが
# 実体は backend/src/）。gitleaks を足して、秘密情報のコミットを機械的に止める。
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        files: ^backend/.*\.py$

  # 🔴 秘密情報の混入を止める最後の砦。
  # 2026-09-23 に hrdb_user のパスワードが scripts/realtime_start.sh と
  # sekito の 3 ファイルにコミットされていたことが判明し、ローテーションした。
  # 「気づいた人が気をつける」では再発するので、コミット時に機械的に見る。
  # 誤検知は .gitleaks.toml の allowlist に理由付きで足すこと。
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # preflight の py_tool と同じ形（backend/ の中で uv run）。
        entry: bash -c 'cd backend && uv run mypy src/ --ignore-missing-imports'
        language: system
        types: [python]
        files: ^backend/.*\.py$
        pass_filenames: false
